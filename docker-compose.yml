name: freshbasket

services:
  web:
    build: .
    image: freshbasket
    container_name: freshbasket-container
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - freshbasket-network

  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - freshbasket-network
  
  celery:
    image: freshbasket
    container_name: celery-container
    command: celery -A config worker -E -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - web
    networks:
      - freshbasket-network

  postgres:
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - freshbasket-network

volumes:
  redis-data:
  postgres-data:

networks:
  freshbasket-network:
    driver: bridge
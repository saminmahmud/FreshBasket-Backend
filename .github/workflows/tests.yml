name: Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freshbasket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: github-actions-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/freshbasket
      REDIS_URL: redis://localhost:6379/0
      STORE_ID: test-store-id
      STORE_PASSWORD: test-store-password
      EMAIL: test@gmail.com
      EMAIL_PASSWORD: test-password
      CLOUD_NAME: test-cloud-name
      CLOUDINARY_API_KEY: test-cloudinary-api-key
      CLOUDINARY_API_SECRET: test-cloudinary-api-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Migrations
        run: uv run manage.py migrate

      - name: Run Tests
        run: uv run manage.py test